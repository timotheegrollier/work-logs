name: CI Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Types, tests, paquets et installation
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      WORKLOGS_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json
      - run: npm ci && npm --prefix api ci && npm --prefix web ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ci-caches-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ci-caches-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb rpm
      - run: ./scripts/check.sh
      - name: Vérifier la version
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          if [[ "$REQUESTED_REF" == refs/tags/* ]]; then
            node scripts/check-release.mjs "${REQUESTED_REF#refs/tags/}"
          elif [[ "$REQUESTED_REF" == v* ]]; then
            node scripts/check-release.mjs "$REQUESTED_REF"
          else
            node scripts/check-release.mjs
          fi
      - run: npm run desktop:dist
      - name: Vérifier le contenu empaqueté
        run: node scripts/verify-package.mjs
      - name: Blockmap différentiel de l’AppImage
        run: |
          node scripts/appimage-blockmap.mjs
          test -f release/latest-linux.yml
          test -n "$(ls release/*.blockmap)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-reports
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  packages:
    name: Installation et lancement — ${{ matrix.distribution }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: mint-22-base
            image: ubuntu:24.04
            format: deb
          - distribution: fedora-43
            image: fedora:43
            format: rpm
          - distribution: fedora-44
            image: fedora:44
            format: rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: release
      - name: Installer et tester le paquet natif puis l’AppImage
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: ./scripts/test-linux-package.sh "$IMAGE" "$FORMAT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: package-reports-${{ matrix.distribution }}
          path: test-results/packages/
          retention-days: 14
