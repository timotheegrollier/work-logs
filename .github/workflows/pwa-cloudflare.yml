name: PWA Cloudflare

# Option B : la PWA vit sur Cloudflare Workers (relais de jetons + front sur la même URL).
# Ce workflow déploie `oauth-proxy/worker.mjs` (qui sert aussi `web/dist/` en assets) sur
# le Cloudflare gratuit à chaque changement sur master. Même groupe de concurrence que
# « Dépôts » et « PWA » : les trois workflows écrivent sur gh-pages ou pushent un Worker,
# ils ne doivent pas se marcher dessus en parallèle.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/emit-sw.mjs'
      # Le build lit la version du paquet racine : un release bump doit reconstruire
      # la PWA, même si aucun fichier web ne change.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa-cloudflare.yml'
      # Tout changement du Worker : le rebuild de la PWA + le déploiement sont requis.
      - 'oauth-proxy/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Reconstruire et redéployer même si rien n’a changé'
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    name: Construire et publier la PWA sur Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
      VITE_GOOGLE_TOKEN_PROXY: ${{ vars.GOOGLE_TOKEN_PROXY_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
      - name: Déployer le Worker Cloudflare (PWA + relais de jetons)
        run: |
          npx wrangler --version
          npx wrangler deploy
