name: PWA Cloudflare

# Option B : la PWA vit sur Cloudflare Workers (relais de jetons + front sur la même URL).
# Ce workflow déploie `oauth-proxy/worker.mjs` (qui sert aussi `web/dist/` en assets) sur
# le Cloudflare gratuit à chaque changement sur master. Même groupe de concurrence que
# « Dépôts » et « PWA » : les trois workflows écrivent sur gh-pages ou pushent un Worker,
# ils ne doivent pas se marcher dessus en parallèle.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/emit-sw.mjs'
      # Le build lit la version du paquet racine : un release bump doit reconstruire
      # la PWA, même si aucun fichier web ne change.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa-cloudflare.yml'
      # Tout changement du Worker : le rebuild de la PWA + le déploiement sont requis.
      - 'oauth-proxy/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Reconstruire et redéployer même si rien n’a changé'
        required: false
        type: boolean

permissions:
  contents: read

# Concurrency propre : ce workflow ne pousse pas sur gh-pages, il ne doit pas
# annuler le déploiement gh-pages (« PWA »), qui partage le sien.
concurrency:
  group: pwa-cloudflare
  cancel-in-progress: false

jobs:
  deploy-cloudflare:
    name: Construire et publier la PWA sur Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Sans VITE_PWA, le build serait la version web qui appelle `/api` : page vide
      # sur le téléphone. La PWA utilise le backend local IndexedDB.
      VITE_PWA: '1'
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
      VITE_GOOGLE_TOKEN_PROXY: ${{ vars.GOOGLE_TOKEN_PROXY_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
      - name: Déployer le Worker Cloudflare (PWA + relais de jetons)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents (docs/07-RELEASES.md §9)'
            exit 1
          fi
          # Même version que le lockfile racine, sans installer Electron pour autant.
          WRANGLER=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")
          # wrangler lit `oauth-proxy/wrangler.toml` ([assets] = ../web/dist) : le
          # deploy part de ce dossier, comme la recette manuelle.
          cd oauth-proxy
          npx --yes "wrangler@$WRANGLER" deploy
