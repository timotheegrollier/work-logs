name: PWA

# La PWA est publiée comme artefact GitHub Pages (quelques Mo). Les dépôts
# rpm/ et deb/ restent sur gh-pages, servis en brut par raw.githubusercontent.com ;
# ils ne passent plus par le déploiement Pages.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/pwa-sw.mjs'
      - 'scripts/emit-sw.mjs'
      # Le service worker lit la version du paquet racine : un release bump
      # doit donc reconstruire la PWA, même si aucun fichier web ne change.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Construire et publier la PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
        env:
          # La PWA utilise le backend local IndexedDB au lieu de `/api`.
          VITE_PWA: '1'
          # Client Google « Web » intégré : un ID client est public par nature.
          # Variable ou secret : les deux sont acceptés (l'ID finit de toute façon dans le JS public).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          # Relais de jetons (Cloudflare Worker `oauth-proxy/`) : il détient le secret du
          # client Web, que Google exige à l'échange du code. Absent : flux « jeton » d'une heure.
          VITE_GOOGLE_TOKEN_PROXY: ${{ vars.GOOGLE_TOKEN_PROXY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Déployer l'artefact Pages
        id: deployment
        uses: actions/deploy-pages@v4
