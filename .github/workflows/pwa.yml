name: PWA

# La PWA statique vit dans `app/` sur gh-pages, à côté des dépôts rpm/ et deb
# (jamais touchés ici). Même groupe de concurrence que « Dépôts » : les deux
# workflows poussent sur gh-pages et ne doivent jamais le faire en même temps.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/pwa-sw.mjs'
      - 'scripts/emit-sw.mjs'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Construire et publier la PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
      - name: Publier `app/` sur gh-pages
        run: |
          git clone -q --branch gh-pages --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" .pages
          rm -rf .pages/app && mkdir -p .pages/app
          cp -r web/dist/. .pages/app/
          test -f .pages/app/index.html && test -f .pages/app/sw.js && test -f .pages/app/manifest.webmanifest
          cd .pages
          git add -A app
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "pwa: ${GITHUB_SHA::12} (WorkLogs mobile)" || { echo "PWA inchangée"; exit 0; }
          for attempt in 1 2 3; do
            git push origin gh-pages && break
            git pull --rebase origin gh-pages || break
            sleep 5
          done
