name: PWA

# La PWA statique vit à la racine de gh-pages ; les dépôts rpm/ et deb/ restent
# dans leurs sous-dossiers dédiés et ne sont jamais touchés ici. Même groupe de
# concurrence que « Dépôts » : les deux workflows poussent sur gh-pages.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'scripts/pwa-sw.mjs'
      - 'scripts/emit-sw.mjs'
      # Le service worker lit la version du paquet racine : un release bump
      # doit donc reconstruire la PWA, même si aucun fichier web ne change.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Construire et publier la PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
        env:
          # La PWA utilise le backend local IndexedDB au lieu de `/api`.
          VITE_PWA: '1'
          # Client Google « Web » intégré : un ID client est public par nature.
          # Variable ou secret : les deux sont acceptés (l'ID finit de toute façon dans le JS public).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          # Relais de jetons (Cloudflare Worker `oauth-proxy/`) : il détient le secret du
          # client Web, que Google exige à l'échange du code. Absent : flux « jeton » d'une heure.
          VITE_GOOGLE_TOKEN_PROXY: ${{ vars.GOOGLE_TOKEN_PROXY_URL }}
      - name: Publier la PWA à la racine sans toucher aux dépôts
        run: |
          git clone -q --branch gh-pages --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" .pages
          # Retirer l'ancien emplacement et les seuls fichiers PWA de la racine.
          # Les dossiers deb/ et rpm/ ne sont jamais supprimés ni remplacés.
          rm -rf .pages/app .pages/assets .pages/icons
          rm -f .pages/index.html .pages/manifest.webmanifest .pages/sw.js .pages/theme.js
          cp -r web/dist/. .pages/
          test -f .pages/index.html && test -f .pages/sw.js && test -f .pages/manifest.webmanifest
          cd .pages
          git add -A -- .
          if git diff --cached --name-only -- deb rpm | grep -q .; then
            echo 'Erreur : le déploiement PWA a modifié un dépôt deb/ ou rpm/'
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "pwa: ${GITHUB_SHA::12} (WorkLogs mobile à la racine)" || { echo "PWA inchangée"; exit 0; }
          for attempt in 1 2 3; do
            git push origin gh-pages && break
            git pull --rebase origin gh-pages || break
            sleep 5
          done
