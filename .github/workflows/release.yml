name: Release Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to verify and stage as a draft (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fast path (see docs/07-RELEASES.md): the release branch is tagged right
  # after its CI went green, then pushed to master. Re-validating on the tag
  # would redo the same tests 15 minutes later, on the same tree. If the tagged
  # commit is on master and already has a successful push CI run for that SHA
  # (branch or master), we skip `validate` and reuse its packages. Anything else
  # (tag on an untested commit, commit absent from master) falls back to the
  # full CI.
  precheck:
    name: Commit déjà validé ?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      run-id: ${{ steps.check.outputs.run-id }}
      sha: ${{ steps.check.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - id: check
        run: |
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[0].object.sha')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Le commit tagué doit appartenir à master : « identical » (même commit)
          # ou « ahead » (master est en avance, le commit en est ancêtre). Un tag
          # annoté donne le SHA de l'objet tag : la comparaison échoue et le
          # chemin plein revalide, comme avant.
          ON_MASTER="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...master" --jq '.status' 2>/dev/null || true)"
          RUN_ID=""
          if [[ "$ON_MASTER" == "identical" || "$ON_MASTER" == "ahead" ]]; then
            # Un run de push a testé exactement ce SHA, sur sa branche ou sur
            # master. Les runs `pull_request` testent la fusion, pas ce SHA :
            # ils ne comptent pas.
            RUN_ID="$(gh run list --commit "$SHA" --workflow 'CI Linux' -R "$GITHUB_REPOSITORY" \
              --json databaseId,conclusion,event \
              --jq '[.[] | select(.conclusion == "success" and .event == "push")] | .[0].databaseId // empty')"
          fi
          if [[ -n "$RUN_ID" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG ($SHA) on master, already validated by push run $RUN_ID — skipping rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No green push CI for $TAG ($SHA) on master — full validation ahead."
          fi

  validate:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    # Le paquet reconstruit embarque le même client Google que la CI.
    secrets: inherit
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Attester et publier les trois paquets
    needs: [precheck, validate]
    # validate is skipped on the fast path — carry on as long as *something*
    # green covers the tagged commit (checked above, enforced here).
    if: ${{ always() && needs.precheck.result == 'success' && (needs.precheck.outputs.skip == 'true' || needs.validate.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          # Les notes de release ont besoin des tags et de l'historique des
          # commits, pas des blobs de gh-pages (D8). Le checkout reste rapide.
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-release.mjs "$TAG"
      # Full path: packages were just built above, in this run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.precheck.outputs.skip != 'true'
        with:
          name: linux-packages
          path: release
      # Fast path: reuse the packages from the green master run (14-day retention).
      - run: gh run download "${{ needs.precheck.outputs.run-id }}" -n linux-packages -D release
        if: needs.precheck.outputs.skip == 'true'
      - name: Sommes de contrôle
        working-directory: release
        run: sha256sum -- *.deb *.rpm *.AppImage *.blockmap latest-linux.yml > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.blockmap
            release/latest-linux.yml
      - name: Préparer les fichiers et les notes de release
        run: |
          node scripts/release-notes.mjs "$TAG" --release-dir release > /tmp/worklogs-notes.md
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/worklogs-release-draft; then
            test "$(cat /tmp/worklogs-release-draft)" = true || { echo 'Une release publiée ne doit pas être remplacée.'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --notes-file /tmp/worklogs-notes.md --title "WorkLogs $TAG"
          fi
          gh release upload "$TAG" release/*.deb release/*.rpm release/*.AppImage release/*.blockmap release/latest-linux.yml release/SHA256SUMS --clobber
      - name: Publier après réussite de toutes les vérifications
        if: github.event_name == 'push'
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
