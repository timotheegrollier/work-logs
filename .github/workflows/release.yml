name: Release Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to verify and stage as a draft (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fast path (see docs/07-RELEASES.md): our process only tags a master commit
  # right after its CI went green, so re-validating from scratch on every tag
  # would just redo the same 6 minutes. If the tagged commit already has a
  # successful CI run on master, we skip `validate` and reuse its packages.
  # Anything else (tag on an untested commit) falls back to the full CI.
  precheck:
    name: Commit déjà validé ?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      run-id: ${{ steps.check.outputs.run-id }}
      sha: ${{ steps.check.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - id: check
        run: |
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[0].object.sha')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          RUN_ID="$(gh run list --commit "$SHA" --workflow 'CI Linux' -R "$GITHUB_REPOSITORY" \
            --json databaseId,conclusion,headBranch \
            --jq '[.[] | select(.conclusion == "success" and .headBranch == "master")] | .[0].databaseId // empty')"
          if [[ -n "$RUN_ID" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG ($SHA) already validated by run $RUN_ID — skipping rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No green CI for $TAG ($SHA) — full validation ahead."
          fi

  validate:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Attester et publier les trois paquets
    needs: [precheck, validate]
    # validate is skipped on the fast path — carry on as long as *something*
    # green covers the tagged commit (checked above, enforced here).
    if: ${{ always() && needs.precheck.result == 'success' && (needs.precheck.outputs.skip == 'true' || needs.validate.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-release.mjs "$TAG"
      # Full path: packages were just built above, in this run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.precheck.outputs.skip != 'true'
        with:
          name: linux-packages
          path: release
      # Fast path: reuse the packages from the green master run (14-day retention).
      - run: gh run download "${{ needs.precheck.outputs.run-id }}" -n linux-packages -D release
        if: needs.precheck.outputs.skip == 'true'
      - name: Sommes de contrôle
        working-directory: release
        run: sha256sum -- *.deb *.rpm *.AppImage > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
      - name: Préparer les fichiers et les notes de release
        run: |
          node scripts/release-notes.mjs "$TAG" --release-dir release > /tmp/worklogs-notes.md
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/worklogs-release-draft; then
            test "$(cat /tmp/worklogs-release-draft)" = true || { echo 'Une release publiée ne doit pas être remplacée.'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --notes-file /tmp/worklogs-notes.md --title "WorkLogs $TAG"
          fi
          gh release upload "$TAG" release/*.deb release/*.rpm release/*.AppImage release/SHA256SUMS --clobber
      - name: Publier après réussite de toutes les vérifications
        if: github.event_name == 'push'
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
