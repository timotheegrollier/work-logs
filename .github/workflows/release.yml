name: Release Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à vérifier et préparer en brouillon (ex. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Attester et publier les trois paquets
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-release.mjs "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: release
      - name: Sommes de contrôle
        working-directory: release
        run: sha256sum -- *.deb *.rpm *.AppImage > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
      - name: Préparer les fichiers et les notes de release
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/worklogs-release-draft; then
            test "$(cat /tmp/worklogs-release-draft)" = true || { echo 'Une release publiée ne doit pas être remplacée.'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "WorkLogs $TAG"
          fi
          gh release upload "$TAG" release/*.deb release/*.rpm release/*.AppImage release/SHA256SUMS --clobber
      - name: Publier après réussite de toutes les vérifications
        if: github.event_name == 'push'
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
