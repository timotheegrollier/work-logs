name: Dépôts

# Se déclenche quand « Release Linux » finit : les publications sont faites avec
# GITHUB_TOKEN, dont les événements `release` ne redéclenchent jamais de workflow
# (anti-boucle GitHub). `workflow_run`, lui, part dans tous les cas — on vérifie
# ensuite que la release est vraiment publiée (pas un brouillon de dispatch).
on:
  workflow_run:
    workflows: ['Release Linux']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release à publier (ex. v0.6.14)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repos
  cancel-in-progress: false

env:
  # Nombre de versions gardées par dépôt. gh-pages sert un site limité à 1 Go :
  # 3 versions × (83 Mo rpm + 121 Mo deb) ≈ 610 Mo, avec de la marge. Les versions
  # plus anciennes restent téléchargeables depuis les releases GitHub, qui ne
  # comptent pas dans cette limite.
  KEEP: 3

jobs:
  repos:
    name: Construire, tester et publier les dépôts dnf et apt
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
      PAGES: https://timotheegrollier.github.io/work-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Garde-fou : release vraiment publiée, avec ses paquets'
        run: |
          [[ "$TAG" == v* ]] || { echo "pas un tag ($TAG), arrêt"; exit 0; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false || { echo "$TAG encore en brouillon, arrêt"; exit 0; }
          for ext in rpm deb; do
            gh release view "$TAG" --json assets --jq -e ".assets[].name | select(endswith(\".$ext\"))" > /dev/null \
              || { echo "pas de .$ext dans $TAG, arrêt"; exit 0; }
          done

      - name: Récupérer le dépôt publié puis y ajouter la nouvelle version
        run: |
          git clone -q --branch gh-pages --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" .pages
          mkdir -p .pages/rpm .pages/deb
          gh release download "$TAG" -p '*.rpm' -D .pages/rpm --clobber
          gh release download "$TAG" -p '*.deb' -D .pages/deb --clobber

      # GitHub refuse tout fichier de plus de 100 Mo dans un dépôt git. Le .deb
      # est passé en xz pour tenir (93 Mo contre 116 en gzip), mais la marge est
      # mince : si une version la dépasse, on publie quand même le dépôt dnf —
      # Fedora ne doit pas être bloquée par la taille du paquet Debian — et le
      # job finit en rouge pour qu'on le sache.
      - name: 'Garde-fou : le .deb tient-il dans la limite git ?'
        run: |
          LIMIT=$((100 * 1024 * 1024))
          BIG=""
          for file in .pages/deb/*.deb; do
            [[ -e "$file" ]] || continue
            size=$(stat -c%s "$file")
            printf '%s : %d Mo\n' "$(basename "$file")" "$((size / 1048576))"
            [[ "$size" -lt "$LIMIT" ]] || BIG="$BIG $(basename "$file")"
          done
          if [[ -n "$BIG" ]]; then
            echo "::error::Paquet(s) au-delà de 100 Mo, dépôt apt non publié :$BIG"
            rm -f .pages/deb/*.deb
            echo "DEB_OK=false" >> "$GITHUB_ENV"
          else
            echo "DEB_OK=true" >> "$GITHUB_ENV"
          fi

      # Rétention : on garde les KEEP versions les plus récentes, sinon le dépôt
      # grossit sans fin (il avait atteint 1,3 Go, 16 RPM jamais purgés).
      - name: Ne garder que les dernières versions
        run: |
          node scripts/prune-repo.mjs .pages/rpm rpm "$KEEP"
          node scripts/prune-repo.mjs .pages/deb deb "$KEEP"
          ls .pages/rpm/*.rpm .pages/deb/*.deb | xargs -n1 basename

      - name: Construire les index
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq createrepo-c dpkg-dev
          # Les métadonnées précédentes sont refaites de zéro : `createrepo_c --update`
          # laissait s'accumuler les anciens fichiers de repodata.
          rm -rf .pages/rpm/repodata
          bash scripts/build-rpm-repo.sh .pages/rpm
          [[ "$DEB_OK" == true ]] && bash scripts/build-deb-repo.sh .pages/deb || echo "dépôt apt ignoré"
          cat > .pages/rpm/worklogs.repo <<EOF
          [worklogs]
          name=WorkLogs
          baseurl=$PAGES/rpm
          enabled=1
          gpgcheck=0
          EOF
          # Dépôt plat : le `/` final est obligatoire, apt lit alors Packages à la racine.
          echo "deb [trusted=yes] $PAGES/deb/ ./" > .pages/deb/worklogs.list

      - name: Tester le dépôt dnf (Fedora jetable)
        run: |
          PREV="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -B1 "^$TAG$" | head -1)"
          docker run --rm -i -v "$PWD/.pages/rpm:/repo:ro" -e TAG="$TAG" -e PREV="$PREV" fedora:44 bash -s <<'CONTAINER'
          set -euo pipefail
          printf '[worklogs]\nname=WorkLogs (test)\nbaseurl=file:///repo\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/worklogs.repo
          if [[ -n "${PREV:-}" && "$PREV" != "$TAG" ]] && dnf install -y -q "worklogs-${PREV#v}" 2>/dev/null; then
            rpm -q worklogs
            dnf update -y -q worklogs
          else
            dnf install -y -q worklogs
          fi
          test "$(rpm -q --qf '%{VERSION}' worklogs)" = "${TAG#v}"
          test -x /opt/WorkLogs/worklogs && echo DNF-OK
          CONTAINER

      # Mint 22.x repose sur Ubuntu 24.04 : c'est la cible réelle du .deb.
      - name: Tester le dépôt apt (Ubuntu jetable)
        if: env.DEB_OK == 'true'
        run: |
          PREV="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -B1 "^$TAG$" | head -1)"
          docker run --rm -i -v "$PWD/.pages/deb:/repo:ro" -e TAG="$TAG" -e PREV="$PREV" ubuntu:24.04 bash -s <<'CONTAINER'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo 'deb [trusted=yes] file:///repo ./' > /etc/apt/sources.list.d/worklogs.list
          apt-get update -qq
          if [[ -n "${PREV:-}" && "$PREV" != "$TAG" ]] && apt-get install -y -qq "worklogs=${PREV#v}" 2>/dev/null; then
            dpkg-query -W -f '${Version}\n' worklogs
            apt-get install -y -qq --only-upgrade worklogs
          else
            apt-get install -y -qq worklogs
          fi
          test "$(dpkg-query -W -f '${Version}' worklogs)" = "${TAG#v}"
          test -x /opt/WorkLogs/worklogs && echo APT-OK
          CONTAINER

      - name: Publier sur gh-pages
        run: |
          cd .pages
          git add -A rpm deb
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "depots: $TAG (dnf + apt, $KEEP versions gardées)" || { echo "rien de neuf"; exit 0; }
          git push origin gh-pages
          du -sh rpm deb

      - name: 'Échec explicite si le dépôt apt a été sauté'
        if: env.DEB_OK != 'true'
        run: |
          echo "Le dépôt dnf est publié, pas le dépôt apt : le .deb dépasse la limite git de 100 Mo."
          echo "Piste : réduire le paquet, ou héberger les .deb hors de gh-pages."
          exit 1
