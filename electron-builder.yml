appId: fr.worklogs.desktop
productName: WorkLogs
directories:
  app: .desktop-app
  output: release
  buildResources: desktop
files:
  - desktop/*.mjs
  - desktop/preload.cjs
  - desktop/icon.png
  - desktop/google-default.json
  - api/src/**
  - api/package.json
  - web/dist/**
  - package.json
asar: true
npmRebuild: false
electronLanguages:
  - fr
  - en-US
linux:
  syncDesktopName: true
  executableName: worklogs
  icon: desktop/icons
  category: Office
  synopsis: Journal de travail personnel
  description: Journal Markdown et suivi de tâches, sur un seul écran, entièrement local.
  maintainer: Timothée Grollier <timotheegrollier@gmail.com>
  artifactName: WorkLogs-${version}-linux-${arch}.${ext}
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: AppImage
      arch: [x64]
  desktop:
    entry:
      Name: WorkLogs
      Comment: Journal de travail et tâches
      Keywords: journal;notes;markdown;tâches;
      StartupWMClass: worklogs
deb:
  # xz, pas gz : GitHub refuse tout fichier de plus de 100 Mo dans un dépôt git,
  # et le .deb en gzip pesait 116 Mo — impossible à publier sur gh-pages, donc
  # pas de dépôt apt ni de mise à jour en un clic sur Debian/Mint. En xz il
  # tombe à ~87 Mo, au niveau du RPM, au prix de quelques minutes de build.
  compression: xz
  # libasound2t64 d'abord : sur Ubuntu 24.04+/Debian 13+ (transition « t64 »),
  # le paquet virtuel libasound2 est « squatté » par liboss4-salsa-asound2, une
  # couche de compatibilité OSS qui n'implémente pas tous les symboles ALSA et
  # fait échouer worklogs au lancement (bug Ubuntu #2069153). L'alternative
  # Debian retombe sur libasound2 pour Ubuntu 22.04, qui n'a pas ce paquet.
  depends: [libgtk-3-0, libnss3, libxss1, libxtst6, libatspi2.0-0, libdrm2, libgbm1, 'libasound2t64 | libasound2', xdg-utils]
  recommends: []
rpm:
  depends: [gtk3, nss, libXScrnSaver, libXtst, at-spi2-core, libdrm, mesa-libgbm, alsa-lib, xdg-utils]
  compression: xz
appImage:
  executableArgs: []
publish:
  provider: github
  owner: timotheegrollier
  repo: work-logs
