# Clavier : si une vue Google masquée retient le focus système, cliquer dans un champ
# WorkLogs lui redonne la main (via le message `focus-field` de `web:google-view`).

# Relais de jetons Google de la PWA et IA gratuite (Cloudflare Worker, offre gratuite).
# La PWA elle-même est sur GitHub Pages (décision §97) : rien à construire avant.
# Depuis ce dossier :
#   npx wrangler login
#   npx wrangler deploy
#   npx wrangler secret put GOOGLE_CLIENT_SECRET   # secret du client « Application Web »
# Détail et vérification : docs/08-GOOGLE-DOCS.md « Relais de jetons ».
name = "worklogs-google"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "841002"
# Une demande à l’assistant fait jusqu’à 4 appels ; le suivi en ajoute.
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "PDF_LIMITER"
namespace_id = "841001"
simple = { limit = 12, period = 60 }

# Compteur partagé de l'usage IA (`AiUsage`, `ai-engines.mjs`) : un objet durable SQLite,
# offert sur Workers Free, créé au premier déploiement.
[[durable_objects.bindings]]
name = "AI_USAGE"
class_name = "AiUsage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiUsage"]
